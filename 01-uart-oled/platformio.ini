; 第一个项目：NUCLEO-G474RE 串口通信 + SSD1306 OLED 显示
; 编译：pio run        烧录：pio run -t upload        串口监视：pio device monitor

[env:nucleo_g474re]
platform = ststm32
board = nucleo_g474re
framework = arduino

; 板载 ST-LINK 既负责烧录，也提供虚拟串口 (VCP)
upload_protocol = stlink
debug_tool = stlink

monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes
monitor_filters = send_on_enter

lib_deps =
    olikraus/U8g2@^2.35.30
