; 第二个项目：STM32 HAL 库工程 + 按键状态机 + 把 U8g2 移植到 HAL
; 编译：pio run        烧录：pio run -t upload        串口监视：pio device monitor
;
; framework = stm32cube 就是 ST 官方的 HAL 库（和 CubeMX / CubeIDE 用的是同一套代码），不再是 Arduino。

[env:nucleo_g474re]
platform = ststm32
board = nucleo_g474re
framework = stm32cube

; 用 include/stm32g4xx_hal_conf.h 决定编译哪些 HAL 模块（相当于在 CubeMX 里勾选外设）
board_build.stm32cube.custom_config_header = yes

upload_protocol = stlink
debug_tool = stlink

monitor_speed = 115200
monitor_eol = LF

build_flags = -Wall
